name: Build Core ASI x86

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "asi/**"
      - ".github/workflows/build-core-asi.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: TEMP audit V200 streaming regions
        shell: pwsh
        run: |
          @'
          import base64, zlib, json
          p = r"patches/original_to_v200.json.zlib.b64"
          raw = base64.b64decode(open(p,"rb").read())
          data = json.loads(zlib.decompress(raw))
          print("keys", data.keys())
          regs = data["regions"]
          print("region_count", len(regs))
          for i in [1, 72, 128, 141, 142, 143, 144, 145, 146]:
              if i < len(regs):
                  r=regs[i]
                  print("REGION", i, "offset", r.get("offset"), "length", r.get("length"))
                  print(" before", r.get("before"))
                  print(" after ", r.get("after"))
          print("STREAM-LIKE")
          for i,r in enumerate(regs):
              off=int(r["offset"],16)
              if 0x009B0000 <= off <= 0x009C0000 or off < 0x00003000:
                  print("REGION",i,"offset",r["offset"],"len",r["length"])
                  print(" before",r["before"])
                  print(" after ",r["after"])
          '@ | Set-Content temp_audit.py
          python temp_audit.py

      - name: Enable MSVC x86 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build x86 proxy and ASI
        shell: cmd
        run: |
          if not exist dist mkdir dist
          cl /nologo /std:c++17 /O2 /MT /W4 /LD asi\src\SaboteurEnhanced.cpp user32.lib /link /OUT:dist\SaboteurEnhanced.asi
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /O2 /MT /W4 /LD asi\src\dinput8_proxy.cpp /link /DEF:asi\src\dinput8.def /OUT:dist\dinput8.dll
          if errorlevel 1 exit /b 1
          copy /Y asi\SaboteurEnhanced.ini dist\SaboteurEnhanced.ini
          copy /Y asi\README.md dist\README.txt

      - name: Verify PE machine is x86
        shell: cmd
        run: |
          dumpbin /headers dist\SaboteurEnhanced.asi | findstr /i "machine"
          dumpbin /headers dist\dinput8.dll | findstr /i "machine"

      - name: SHA-256
        shell: pwsh
        run: |
          Get-FileHash dist\SaboteurEnhanced.asi -Algorithm SHA256 | Format-List
          Get-FileHash dist\dinput8.dll -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: SaboteurEnhanced_ASI_0.25_STREAMING_TELEMETRY_DIAGNOSTIC_x86
          path: dist/*
          if-no-files-found: error
          compression-level: 0
