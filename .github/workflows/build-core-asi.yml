name: Build Core ASI x86

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "asi/**"
      - ".github/workflows/build-core-asi.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Audit historical Havok 1024 to 2048 owner
        shell: pwsh
        run: |
          @'
          import base64, json, zlib
          from pathlib import Path
          p = Path("patches/original_to_v200.json.zlib.b64")
          m = json.loads(zlib.decompress(base64.b64decode(p.read_bytes())).decode("utf-8"))
          pairs = [(1024, 2048), (250, 512)]
          for old, new in pairs:
              ob = int(old).to_bytes(4, "little")
              nb = int(new).to_bytes(4, "little")
              print(f"=== {old}->{new} ===")
              for i, r in enumerate(m["regions"]):
                  b = bytes.fromhex(r["before"])
                  a = bytes.fromhex(r["after"])
                  for j in range(0, len(b)-3):
                      if b[j:j+4] == ob and a[j:j+4] == nb:
                          print("region", i, "offset", r["offset"], "inner", hex(j), "length", r["length"])
                          print("before", r["before"])
                          print("after ", r["after"])
          '@ | python -

      - name: Enable MSVC x86 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build x86 proxy and ASI
        shell: cmd
        run: |
          if not exist dist mkdir dist
          cl /nologo /std:c++17 /O2 /MT /W4 /LD asi\src\SaboteurEnhanced.cpp user32.lib /link /OUT:dist\SaboteurEnhanced.asi
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /O2 /MT /W4 /LD asi\src\dinput8_proxy.cpp /link /DEF:asi\src\dinput8.def /OUT:dist\dinput8.dll
          if errorlevel 1 exit /b 1
          copy /Y asi\SaboteurEnhanced.ini dist\SaboteurEnhanced.ini
          copy /Y asi\README.md dist\README.txt

      - name: Verify PE machine is x86
        shell: cmd
        run: |
          dumpbin /headers dist\SaboteurEnhanced.asi | findstr /i "machine"
          dumpbin /headers dist\dinput8.dll | findstr /i "machine"

      - name: SHA-256
        shell: pwsh
        run: |
          Get-FileHash dist\SaboteurEnhanced.asi -Algorithm SHA256 | Format-List
          Get-FileHash dist\dinput8.dll -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: SaboteurEnhanced_ASI_0.41_PERF_ISOLATION_SPHERE_NATIVE_TEST_x86
          path: dist/*
          if-no-files-found: error
          compression-level: 0
