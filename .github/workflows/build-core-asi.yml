name: Build Core ASI x86

on:
  workflow_dispatch:
  push:
    branches: [main, "dev/asi-0.50-proxy-creation-capture", "dev/asi-0.51-proxy-outparams-diff", "dev/asi-0.52-runtime-structure-observation", "dev/asi-0.53-fallback-correlation"]
    paths:
      - "asi/**"
      - ".github/workflows/build-core-asi.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Enable MSVC x86 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build x86 proxy and ASI
        shell: cmd
        run: |
          if not exist dist mkdir dist
          cl /nologo /std:c++17 /O2 /MT /W4 /LD asi\src\SaboteurEnhanced.cpp user32.lib /link /OUT:dist\SaboteurEnhanced.asi
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /O2 /MT /W4 /LD asi\src\dinput8_proxy.cpp /link /DEF:asi\src\dinput8.def /OUT:dist\dinput8.dll
          if errorlevel 1 exit /b 1
          copy /Y asi\SaboteurEnhanced.ini dist\SaboteurEnhanced.ini
          copy /Y asi\README.md dist\README.txt

      - name: Verify PE machine is x86
        shell: cmd
        run: |
          dumpbin /headers dist\SaboteurEnhanced.asi | findstr /i "machine"
          dumpbin /headers dist\dinput8.dll | findstr /i "machine"

      - name: SHA-256
        shell: pwsh
        run: |
          Get-FileHash dist\SaboteurEnhanced.asi -Algorithm SHA256 | Format-List
          Get-FileHash dist\dinput8.dll -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: SaboteurEnhanced_ASI_0.53_FALLBACK_CORRELATION_x86
          path: dist/*
          if-no-files-found: error
          compression-level: 0

      - name: Package one flat ZIP for ASI 0.52 prerelease
        if: github.ref == 'refs/heads/dev/asi-0.52-runtime-structure-observation'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath SaboteurEnhanced_ASI_0.52_NATIVE_STRUCTURE_CONTEXT_TEST_x86.zip -Force
          Add-Type -AssemblyName System.IO.Compression
          $zip = [System.IO.Compression.ZipFile]::OpenRead("$PWD/SaboteurEnhanced_ASI_0.52_NATIVE_STRUCTURE_CONTEXT_TEST_x86.zip")
          try {
            $items=@($zip.Entries | ForEach-Object { $_.FullName })
            $expected=@('SaboteurEnhanced.asi','dinput8.dll','SaboteurEnhanced.ini','README.txt')
            if (@(Compare-Object $items $expected).Count -ne 0) { throw "Unexpected ZIP layout: $($items -join ', ')" }
          } finally { $zip.Dispose() }

      - name: Publish ASI 0.52 TEST prerelease
        if: github.ref == 'refs/heads/dev/asi-0.52-runtime-structure-observation'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag="ASI-0.52-TEST"
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release upload $tag SaboteurEnhanced_ASI_0.52_NATIVE_STRUCTURE_CONTEXT_TEST_x86.zip --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag SaboteurEnhanced_ASI_0.52_NATIVE_STRUCTURE_CONTEXT_TEST_x86.zip --target $env:GITHUB_SHA --prerelease --title "ASI 0.52 - Native Structure Context TEST" --notes-file docs/ASI_0_52_RUNTIME_RESULT.md --repo $env:GITHUB_REPOSITORY
          }

      - name: Package flat ASI 0.53 experimental ZIP
        if: github.ref == 'refs/heads/dev/asi-0.53-fallback-correlation'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath SaboteurEnhanced_ASI_0.53_FALLBACK_NATIVE_CORRELATION_TEST_x86.zip -Force
          Add-Type -AssemblyName System.IO.Compression
          $zip=[System.IO.Compression.ZipFile]::OpenRead("$PWD/SaboteurEnhanced_ASI_0.53_FALLBACK_NATIVE_CORRELATION_TEST_x86.zip")
          try {
            $items=@($zip.Entries | ForEach-Object { $_.FullName })
            $expected=@('SaboteurEnhanced.asi','dinput8.dll','SaboteurEnhanced.ini','README.txt')
            if(@(Compare-Object $items $expected).Count -ne 0) { throw "ZIP root incorrect: $($items -join ',')" }
          } finally { $zip.Dispose() }

      - name: Publish ASI 0.53 prerelease
        if: github.ref == 'refs/heads/dev/asi-0.53-fallback-correlation'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag="ASI-0.53-TEST"
          $file="SaboteurEnhanced_ASI_0.53_FALLBACK_NATIVE_CORRELATION_TEST_x86.zip"
          if(gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release upload $tag $file --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $file --target $env:GITHUB_SHA --prerelease --title "ASI 0.53 - Fallback/native correlation TEST" --notes-file docs/ASI_0_53_FALLBACK_CORRELATION.md --repo $env:GITHUB_REPOSITORY
          }
