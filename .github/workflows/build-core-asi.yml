name: Build Core ASI x86

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "asi/**"
      - ".github/workflows/build-core-asi.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Enable MSVC x86 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Audit historical V200 bloom patch manifest
        shell: pwsh
        run: |
          python -c "import base64,zlib,json,pathlib; p=pathlib.Path('patches/original_to_v200.json.zlib.b64').read_text().strip(); o=json.loads(zlib.decompress(base64.b64decode(p))); print('TYPE',type(o).__name__); print('KEYS', list(o.keys()) if isinstance(o,dict) else 'LIST'); print('HEAD', (list(o.items())[:2] if isinstance(o,dict) else o[:3]))"
          python -c "import base64,zlib,json,pathlib; o=json.loads(zlib.decompress(base64.b64decode(pathlib.Path('patches/original_to_v200.json.zlib.b64').read_text().strip()))); seq=o['regions']; print('REGION_COUNT',len(seq)); print('REGION_HEAD',seq[:3]); [print('BLOOM_REGION',x) for x in seq if any((isinstance(v,int) and 0xD62000 <= v <= 0xD6B000) or (isinstance(v,str) and any(k in v.lower() for k in ['d62','d63','d64','d65','d66','d67','d68','d69','bloom'])) for v in (x.values() if isinstance(x,dict) else []))]"
      - name: Build x86 proxy and ASI
        shell: cmd
        run: |
          if not exist dist mkdir dist
          cl /nologo /std:c++17 /O2 /MT /W4 /LD asi\src\SaboteurEnhanced.cpp user32.lib /link /OUT:dist\SaboteurEnhanced.asi
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /O2 /MT /W4 /LD asi\src\dinput8_proxy.cpp /link /DEF:asi\src\dinput8.def /OUT:dist\dinput8.dll
          if errorlevel 1 exit /b 1
          copy /Y asi\SaboteurEnhanced.ini dist\SaboteurEnhanced.ini
          copy /Y asi\README.md dist\README_ASI.md

      - name: Verify PE machine is x86
        shell: cmd
        run: |
          dumpbin /headers dist\SaboteurEnhanced.asi | findstr /i "machine"
          dumpbin /headers dist\dinput8.dll | findstr /i "machine"

      - name: SHA-256
        shell: pwsh
        run: |
          Get-FileHash dist\SaboteurEnhanced.asi -Algorithm SHA256 | Format-List
          Get-FileHash dist\dinput8.dll -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: SaboteurEnhanced_ASI_0.17_BLOOM_ENERGY_COMPENSATION_TEST_x86
          path: dist/*
          if-no-files-found: error
          compression-level: 0
