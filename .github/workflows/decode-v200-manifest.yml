name: Decode historical V200 manifest

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/decode-v200-manifest.yml"

jobs:
  decode:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Decode zlib manifest
        shell: pwsh
        run: |
          $b64 = (Get-Content "patches/original_to_v200.json.zlib.b64" -Raw).Trim()
          $compressed = [Convert]::FromBase64String($b64)
          $input = [IO.MemoryStream]::new($compressed)
          $z = [IO.Compression.ZLibStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
          $output = [IO.MemoryStream]::new()
          $z.CopyTo($output)
          [IO.File]::WriteAllBytes("original_to_v200.decoded.json", $output.ToArray())
          $z.Dispose()
          $input.Dispose()
          $output.Dispose()
      - uses: actions/upload-artifact@v4
        with:
          name: original_to_v200_decoded
          path: original_to_v200.decoded.json
          compression-level: 0
