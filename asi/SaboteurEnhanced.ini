; 0.8A visual-safety reset:
; Screenshot validation of 0.8 showed visible shadow/cascade bands and a dull image.
; Advanced tonal/shadow/AO tuning is therefore native by default.
; Safe quality/resolution and validated distance controls remain enabled.
; The Saboteur Enhanced Patch
; Core 1 + canonical ASI 0.29 profile + ASI 0.30 WSModel hard-cull test
; Each proven engine/render finding has its own control.
; Native/retail fallback values are documented beside each entry.

[Fixes]
; Validated V310/V311 draw-distance correctness fixes.
WSModelFullRenderMask=1
ModelInfoFullRenderSlice=1

; Current WSDynamicPart A/B. Native = 25.
WSDynamicPartPriorityRadius=50

; 0.30 surgical renderer test.
; Retail rewrites WSModel+0xA8 for small unlisted models to a short
; size-derived hard-cull distance. 1 keeps the constructor default 10000
; while preserving the independent AC/shadow-distance calculation.
WSModelSmallObjectHardCullBypass=1

; Rejected experiments. Keep disabled.
OdinChildVisibilityGate=0
WSDamageableVariantSelector=0

[Graphics]
; Validated environment maps. Native = 128, retained project value = 2048.
EnvironmentMapResolution=2048

; Validated texture filtering. Native project owner = 4x, retained = 16x.
AnisotropicFiltering=16

; Validated sampler MIP bias. Native = 0.0.
MipLODBias=0.0

; Validated tone-map scalar. Native = 0.25.
ToneMap=0.25

[Shadows]
; Shared WSShadowZBuffer / HardwareRainDepthTexture width/height owner.
; Native = 1024. The ASI now also derives all 24 embedded PCF texel offsets
; from this resolution, preserving the retail sampling radius at 2048/4096/8192.
ShadowMapResolution=4096

; True shader-family selector recovered from retail/V200.
; 0 = retail SampleShadowMapPCF3x3, 1 = verified SampleShadowMapPCF5x5.
; Independent from ShadowMapResolution and its automatically scaled offsets.
ShadowPCF5x5=1

; Cascade split lambda. Native = 0.50.
CSMLambda=0.50

; Historical CSM far target. Native ~100, retained project target = 150.
CSMFarDistance=100.0

; Recovered shadow depth/slope bias table multipliers.
; Native tables = 1.00 / 1.00.
DepthBiasScale=1.00
SlopeBiasScale=1.00

; Dedicated WSSpotShadowZBuffer dimension multiplier.
; Retail = 0.50. Kept retail in the 0.11 clean visual baseline.
SpotShadowResolutionScale=0.5

[AmbientOcclusion]
; Reconstructed 0.11 atomic full-resolution AO path.
; 0 = exact retail half-resolution. 1 applies BOTH CPU RT dimensions plus the
; matched PsAmbientOcclusion/PsDepthConv shader changes. Kept OFF for baseline.
FullResolution=1

; Retained AO filter tuning. Native = 2.0 / 2.0.
BlurScale=2.0
ErodeScale=2.0

[UI]
; Exact Scaleform cache owners recovered from retail and historical V200.
; Only the audited retail/V200 pairs are supported in 0.29.
; Retail = 8 MiB / 512 glyphs / 1 texture.
; Historical V200 = 16 MiB / 1024 glyphs / 2 textures.
MeshCacheMiB=16
VectorGlyphCache=1024
FontCacheTextures=2

[Streaming]
; Proven streaming-grid coverage values.
; Native Low/Medium/High = 1500 / 300 / 250.
; Retained validated V282-V284 = 16000 / 3200 / 2500.
CoverageLow=16000
CoverageMedium=3200
CoverageHigh=2500

; Maximum cumulative bytes in one coalesced contiguous-read batch.
; Retail = 512000 (0x7D000). Historical V200 set this directly to 128 MiB.
CoalescedReadBatchByteLimit=512000

[Distances]
; FarScene three-value table. Native = 200, retained V257 = 320.
FarScene=320

; Decal visibility is stored internally as squared distance.
; Native = 120 (14400), retained = 160 (25600).
DecalVisibility=160

; ShadowSlice/CSM High class-3 far bound, previously mislabeled as a generic
; object draw-distance control. Native = 100. Kept retail for the 0.11
; banding-isolation baseline; historical V277 tested 300.
RenderSlice3HighFar=100

; ShadowSlice/CSM High final outer endpoint. Native = 500.
; Kept retail for the 0.11 banding-isolation baseline; V275 tested 1500.
RenderSliceHighOuter=500

; Default ModelInfo LODDIST used when a model has no explicit LODDIST25/30 override.
; Native = 1000, validated V278 = 1500.
ModelInfoDefaultLODDistance=1500

; Terrain-only VeryFarScene distance.
; Native = 5000, validated V279 = 10000.
VeryFarSceneTerrain=10000

; Retail graphics-profile ClipRange=3 (High/default) = 1000.
; This entry is kept at retail by default until a higher value is isolated in-game.
ClipRangeHigh=1000

; WSDetailSystem +0x218. Retail starts at 50 and clamps to a maximum of 100.
; Historical V281 validated 1000. The lower 10-unit minimum remains untouched.
; Set 0 to keep the exact retail 50/100 behavior.
DetailSystemDistance=1000

; WSHuman ObjectQuality distance multiplier.
; Retail constants: 5 / 10 / 14 / 20 / 30 / 40 / 60.
; Historical validated V257 scale = 5x:
; 25 / 50 / 70 / 100 / 150 / 200 / 300.
HumanObjectQualityScale=5.0

; FOLIAGE-tagged ModelInfo LODDIST override.
; Retail = 50, V200 = 200, validated V257 = 250.
FoliageModelLODDistance=250

; Minimum ModelInfo LODDIST for models with a non-zero ShadowSlice.
; Retail has no clamp. Historical V200 introduced 180 and V257 validated 240.
; Set 0 to disable this enhancement and keep retail behavior.
ShadowCasterMinLODDistance=240

; Minimum particle-resource LOD/distance value used by two WSParticleObject paths.
; Retail reads the raw resource value. Historical V200 introduced a 100 floor,
; and V257 validated a 150 floor. Set 0 to disable the enhancement.
ParticleLODMinDistance=150

[Experimental]
; SS_HighPalette resource-priority threshold.
; Native = 80. Historical validated progression reached 1600,
; but no isolated visual benefit was proven, so the default remains native.
HighPaletteThreshold=80

[ExperimentalPostFX]
; WSMotionBlurFilter activation threshold.
; Retail = 0.12. This controls when motion components are large enough to
; enter the blur path; it is NOT a blur-strength setting.
MotionBlurActivationThreshold=0.12

; WSDepthBlurFilter automatic transition:
; approximately clamp(max(sourceValue - Start, 0) / Range, 0, 1).
; Retail = 200 / 50. Source-value semantics are still under audit, so these
; remain native by default.
DepthBlurAutoStart=200
DepthBlurAutoRange=50

; MotionBlurDownsampledBackBuffer is backbuffer/2 in retail.
; 0 = native half-resolution, 1 = full-resolution. Experimental.
MotionBlurFullResolution=1

; Bloom/GodRays native pyramid is /4, /8, /16, /32.
; 1 = native. 2 = coherent 2x resolution => /2, /4, /8, /16.
; The separate ScaledTexture source remains native /2.
BloomResolutionMultiplier=2

; PsBloom extraction gain before luminance thresholding and blur.
; Retail = 4.0. With the Bloom/GodRays pyramid promoted from /4 to /2,
; 0.21 uses 1.0 as the 4x area-energy normalization test while preserving
; the higher-resolution pyramid and the retail final composite.
BloomPrefilterGain=1.0

; PsBloomFinal final contribution scalar.
; Retail = 4.0. This does NOT change ToneMap, exposure, sampler routing or
; Bloom/GodRays render-target resolution. 0.17 uses 2.0 to halve bloom energy
; while preserving the enhanced 2x pyramid.
BloomFinalContribution=4.0

; Historical V28/V200 anti-blur companion.
; 0 = retail SkyBloomTextureSampler s4.
; 1 = BackBufferSampler s0 for a sharper final composite.
BloomFinalBackBufferSampler=0

; Historical V28/V29 anti-blur source correction.
; 0 = retail DownsampledBackBufferSampler s2.
; 1 = BackBufferSampler s0. Distinct from the SkyBloom sampler option above.
BloomFinalDownsampledBackBufferSampler=0

; Generic ScaledTexture source is backbuffer/2 in retail.
; 0 = native half-resolution, 1 = full-resolution. Experimental.
ScaledTextureFullResolution=1

; DepthBlurMask2x2 / Temp local resolution scale.
; Native = 0.5. 1.0 would create this mask at full source resolution.
DepthBlurMaskResolutionScale=1.0

; NEW 0.14 shader-side compensation. Native shader tap spacing = 1.0.
; Because the mask RT is doubled from 0.5x to 1.0x, 0.5 preserves the
; original screen-space filter radius instead of sampling twice as far.
DepthBlurMaskTapOffsetScale=0.5

; DepthBlurColor pyramid local divisor factor.
; Retail = 0.75, producing effective divisors 1.5 / 3 / 6 / 12.
; 0.5 would produce a higher-resolution 1 / 2 / 4 / 8 pyramid.
; Experimental: native default retained.
DepthBlurColorPyramidFactor=0.5

; NEW 0.14 shader-side texel compensation. Native = 1.0.
; 0.75 -> 0.5 makes every color-pyramid level 1.5x larger per dimension,
; therefore 2/3 keeps the retail screen-space texel offset.
DepthBlurColorTexelOffsetScale=0.6666667

; BackBufferLDRPostFiltersDamageBlur local resolution scale.
; Retail = 0.5 (half-resolution). 1.0 = full-resolution.
DamageBlurResolutionScale=1.0

[Water]
; WaterReflection render target. Retail = 512x128.
; Both owner globals are shared coherently by creation/backend paths.
ReflectionWidth=4096
ReflectionHeight=1024

; WaterNormals%d and WaterNormalsTemp%d. Retail = 128x128.
NormalMapResolution=1024

[Sky]
; Coherent SkyDome render-target quality multiplier.
; Retail = 1: main blend /4, 3x3 family /12, distortion /8.
; 2 raises all three families coherently to /2, /6, /4.
ResolutionMultiplier=2

[Rain]
; RainCubeRT face resolution. Retail = 128.
; HardwareRainDepthTexture is NOT controlled here: it shares the
; ShadowMapResolution owner with WSShadowZBuffer.
CubeResolution=1024

; Hidden engine RainDensity setting override.
; 0 = use retail/config value. Retail default = 100 (%).
; Native consumer clamps the effective result to 25..200%.
DensityPercentOverride=0

[Lighting]
; LightVolumeRT is half-resolution in retail.
; 1 = native /2, 2 = full-resolution.
LightVolumeResolutionMultiplier=2

; WSLightVolumeManager owns a SECOND independent internal resolution profile.
; Retail = 0.5, matching the native /2 LightVolumeRT.
; With LightVolumeResolutionMultiplier=2 (full resolution), 1.0 keeps the
; manager's width/height, reciprocal coordinates and the RT mathematically
; coherent. This is the 0.15 CorrectUV-equivalent LightVolume test.
LightVolumeCoordinateResolutionScale=1.0

[Particles]
; Coherent WSParticleRender target quality multiplier.
; Retail 1x: main particle post-FX family /2, ParticleBB3 family /16.
; 2x: main family full-resolution, BB3 family /8.
RenderTargetResolutionMultiplier=2

; RestoreDepthBuffer in ApplyPS.hlsl contains a separate packed half-column
; coordinate reconstruction authored for the retail /2 ParticleBB0 layout.
; 0 = retail shader mapping. 1 = full-resolution identity mapping.
; Keep enabled when RenderTargetResolutionMultiplier=2.
FullResolutionDepthRestore=1

[WillToFight]
; CPU influence grid + LowResWorldWTF + LowResWorldWTFVertex.
; Retail = 256. Historical 1024 diagnostic did not solve the red-material issue,
; so this stays native by default.
GridResolution=256

; WTFTransitionRingRT / Temp / Previous family.
; Retail = 128x128. One coherent owner controls all three RTs.
TransitionRingResolution=128

[ExperimentalDistances]
; Real VeryFarScene profile-record +0x08 thresholds.
; Retail profile 0 / profile 1 = 22 / 49.
; Historical x4 test did not fix the balcony/facade symptom, so native defaults
; are retained. The unrelated shared 49.0 consumer is never touched.
VeryFarSceneProfile0Threshold=22
VeryFarSceneProfile1Threshold=49

[EngineLimits]
; Exact retail fixed-pool capacities. Native defaults are intentionally kept.
; Increase only for testing actual pool pressure.
WSLuaCallCapacity=20
WSParkingSpaceCapacity=32
WSParticleInfoDataCapacity=1400
WSActivateSphereCapacity=256

; WallPoint and WallSegment are a matched pair in retail.
; One key keeps both capacities coherent.
WallGraphCapacity=50

; Coupled particle/physics limits. These patch allocation AND matching runtime caps.
; Retail defaults retained.
WSPhysicsParticleCapacity=1000

; WSParticleRender has three arena classes. The ASI also resizes matching
; runtime ceilings and sort scratch buffers to keep each class coherent.
WSParticleRenderMainCapacity=4500
WSParticleRenderMediumCapacity=1000
WSParticleRenderSmallCapacity=500

; Exact retail Havok continuous-simulation TOI queue field.
; Retail is 250. The old cumulative branch had already reached 512 before
; V262 raised it again to 1024.
HavokTOIEventQueue=250

; Shared source for both WSReadJob and WSUncompressJob.
StreamingJobCapacity=1200

; WORD-linked CRC tree; 0xFFFF is the sentinel, so never exceed 65534.
PblCRCTreeNodeCapacity=40000

; Class-owned pool constants proven directly from retail initializers.
WSDamageSphereCapacity=512
WSInventoryStateStowCapacity=32

; WSDecal pool plus matching active-list ceiling.
; Retail = 400. Historical V260 validated 800.
WSDecalCapacity=400

[Diagnostics]
OdinInstancing=0
OdinTraceAllQueries=0
OdinEventLimit=5000
FingerprintWindowMs=1200
FingerprintMaxRoots=16
PoolTelemetry=0
