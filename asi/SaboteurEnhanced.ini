[Fixes]
; Validated V310 behavior. Keeps automatically classified WSModel objects on the full RenderSlice mask.
WSModelFullRenderMask=1

; Validated V311 behavior. Forces explicit ModelInfo RenderSlice values through the full 0x1F mask path.
ModelInfoFullRenderSlice=1

[Diagnostics]
; ASI 0.3 correlation build.
; Hooks the OdinMeshInstance sync routine at RVA 0x00A14610.
OdinInstancing=1

; Retained for compatibility with 0.2. Query-style vtable hooks are no longer used by default.
OdinTraceAllQueries=0

; Safety cap for ODIN event lines.
OdinEventLimit=5000

; Press F9 when the balcony/detail APPEARS or DISAPPEARS.
; Each press writes a [MARK] line to SaboteurEnhanced.log.
DiagnosticMarkerKey=F9

PoolTelemetry=0
