; 0.8A visual-safety reset:
; Screenshot validation of 0.8 showed visible shadow/cascade bands and a dull image.
; Advanced tonal/shadow/AO tuning is therefore native by default.
; Safe quality/resolution and validated distance controls remain enabled.
; The Saboteur Enhanced Patch
; Core 1 + SaboteurEnhanced ASI 0.10
; Each proven engine/render finding has its own control.
; Native/retail fallback values are documented beside each entry.

[Fixes]
; Validated V310/V311 draw-distance correctness fixes.
WSModelFullRenderMask=1
ModelInfoFullRenderSlice=1

; Current WSDynamicPart A/B. Native = 25.
WSDynamicPartPriorityRadius=50

; Rejected experiments. Keep disabled.
OdinChildVisibilityGate=0
WSDamageableVariantSelector=0

[Graphics]
; Validated environment maps. Native = 128, retained project value = 2048.
EnvironmentMapResolution=2048

; Validated texture filtering. Native project owner = 4x, retained = 16x.
AnisotropicFiltering=16

; Validated sampler MIP bias. Native = 0.0.
MipLODBias=0.0

; Validated tone-map scalar. Native = 0.25.
ToneMap=0.25

[Shadows]
; Shared WSShadowZBuffer / HardwareRainDepthTexture width/height owner.
; Native = 1024. This intentionally controls both resources because retail
; uses the same two dimension globals for them.
ShadowMapResolution=4096

; Redirect the retail PCF 3x3 parameter family to the recovered PCF 5x5 family.
ShadowPCF5x5=0

; Historical internal shadow/CSM quality selector. Native = 2.
; This is NOT documented as a literal cascade count.
CSMQuality=2

; Cascade split lambda. Native = 0.50.
CSMLambda=0.50

; Historical CSM far target. Native ~100, retained project target = 150.
CSMFarDistance=100.0

; Recovered shadow depth/slope bias table multipliers.
; Native tables = 1.00 / 1.00.
DepthBiasScale=1.00
SlopeBiasScale=1.00

; Dedicated WSSpotShadowZBuffer dimension multiplier.
; Retail = 0.50. 1.00 creates spot-shadow buffers at full render dimensions.
; Only the three resource-size multipliers are patched; the separate projection
; midpoint use of 0.5 remains untouched.
SpotShadowResolutionScale=1.0

[AmbientOcclusion]
; V41/V42 full-resolution AO path. Native buffers/sample scale are half-resolution.
FullResolution=0

; Retained AO filter tuning. Native = 2.0 / 2.0.
BlurScale=2.0
ErodeScale=2.0

[Streaming]
; Proven streaming-grid coverage values.
; Native Low/Medium/High = 1500 / 300 / 250.
; Retained validated V282-V284 = 16000 / 3200 / 2500.
CoverageLow=16000
CoverageMedium=3200
CoverageHigh=2500

[Distances]
; FarScene three-value table. Native = 200, retained V257 = 320.
FarScene=320

; Decal visibility is stored internally as squared distance.
; Native = 120 (14400), retained = 160 (25600).
DecalVisibility=160

; High RenderSlice / ShadowSlice class-3 far bound.
; Native = 100, validated V277 = 300.
RenderSlice3HighFar=300

; High RenderSlice / ShadowSlice final outer endpoint.
; Native = 500, validated V275 = 1500.
RenderSliceHighOuter=1500

; Default ModelInfo LODDIST used when a model has no explicit LODDIST25/30 override.
; Native = 1000, validated V278 = 1500.
ModelInfoDefaultLODDistance=1500

; Terrain-only VeryFarScene distance.
; Native = 5000, validated V279 = 10000.
VeryFarSceneTerrain=10000

; Retail graphics-profile ClipRange=3 (High/default) = 1000.
; This entry is kept at retail by default until a higher value is isolated in-game.
ClipRangeHigh=1000

; WSDetailSystem +0x218. Retail starts at 50 and clamps to a maximum of 100.
; Historical V281 validated 1000. The lower 10-unit minimum remains untouched.
; Set 0 to keep the exact retail 50/100 behavior.
DetailSystemDistance=1000

; WSHuman ObjectQuality distance multiplier.
; Retail constants: 5 / 10 / 14 / 20 / 30 / 40 / 60.
; Historical validated V257 scale = 5x:
; 25 / 50 / 70 / 100 / 150 / 200 / 300.
HumanObjectQualityScale=5.0

; FOLIAGE-tagged ModelInfo LODDIST override.
; Retail = 50, V200 = 200, validated V257 = 250.
FoliageModelLODDistance=250

; Minimum ModelInfo LODDIST for models with a non-zero ShadowSlice.
; Retail has no clamp. Historical V200 introduced 180 and V257 validated 240.
; Set 0 to disable this enhancement and keep retail behavior.
ShadowCasterMinLODDistance=240

; Minimum particle-resource LOD/distance value used by two WSParticleObject paths.
; Retail reads the raw resource value. Historical V200 introduced a 100 floor,
; and V257 validated a 150 floor. Set 0 to disable the enhancement.
ParticleLODMinDistance=150

[Experimental]
; SS_HighPalette resource-priority threshold.
; Native = 80. Historical validated progression reached 1600,
; but no isolated visual benefit was proven, so the default remains native.
HighPaletteThreshold=80

[ExperimentalPostFX]
; WSMotionBlurFilter activation threshold.
; Retail = 0.12. This controls when motion components are large enough to
; enter the blur path; it is NOT a blur-strength setting.
MotionBlurActivationThreshold=0.12

; WSDepthBlurFilter automatic transition:
; approximately clamp(max(sourceValue - Start, 0) / Range, 0, 1).
; Retail = 200 / 50. Source-value semantics are still under audit, so these
; remain native by default.
DepthBlurAutoStart=200
DepthBlurAutoRange=50

; MotionBlurDownsampledBackBuffer is backbuffer/2 in retail.
; 0 = native half-resolution, 1 = full-resolution. Experimental.
MotionBlurFullResolution=0

; Bloom/GodRays native pyramid is /4, /8, /16, /32.
; 1 = native. 2 = coherent 2x resolution => /2, /4, /8, /16.
; The separate ScaledTexture source remains native /2.
BloomResolutionMultiplier=1

; Generic ScaledTexture source is backbuffer/2 in retail.
; 0 = native half-resolution, 1 = full-resolution. Experimental.
ScaledTextureFullResolution=0

; DepthBlurMask2x2 / Temp local resolution scale.
; Native = 0.5. 1.0 would create this mask at full source resolution.
DepthBlurMaskResolutionScale=0.5

[Water]
; WaterReflection render target. Retail = 512x128.
; Both owner globals are shared coherently by creation/backend paths.
ReflectionWidth=512
ReflectionHeight=128

; WaterNormals%d and WaterNormalsTemp%d. Retail = 128x128.
NormalMapResolution=128

[Rain]
; RainCubeRT face resolution. Retail = 128.
; HardwareRainDepthTexture is NOT controlled here: it shares the
; ShadowMapResolution owner with WSShadowZBuffer.
CubeResolution=128

[WillToFight]
; CPU influence grid + LowResWorldWTF + LowResWorldWTFVertex.
; Retail = 256. Historical 1024 diagnostic did not solve the red-material issue,
; so this stays native by default.
GridResolution=256

[ExperimentalDistances]
; Real VeryFarScene profile-record +0x08 thresholds.
; Retail profile 0 / profile 1 = 22 / 49.
; Historical x4 test did not fix the balcony/facade symptom, so native defaults
; are retained. The unrelated shared 49.0 consumer is never touched.
VeryFarSceneProfile0Threshold=22
VeryFarSceneProfile1Threshold=49

[Diagnostics]
OdinInstancing=0
OdinTraceAllQueries=0
OdinEventLimit=5000
FingerprintWindowMs=1200
FingerprintMaxRoots=16
PoolTelemetry=0
