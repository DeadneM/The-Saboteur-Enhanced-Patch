[Fixes]
WSModelFullRenderMask=1
ModelInfoFullRenderSlice=1

; ASI 0.5 A/B:
; ignore only the Odin/repeat child rejection caused by an exact 0.0f state.
; Parent visibility still remains native.
OdinChildVisibilityGate=1

[Diagnostics]
; 0.5 returns to a clean A/B build. No F9/fingerprint logging by default.
OdinInstancing=0
OdinTraceAllQueries=0
OdinEventLimit=5000
FingerprintWindowMs=1200
FingerprintMaxRoots=16
PoolTelemetry=0
