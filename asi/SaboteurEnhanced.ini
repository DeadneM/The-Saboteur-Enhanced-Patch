[Fixes]
; Validated V310 behavior. Keeps automatically classified WSModel objects on the full RenderSlice mask.
WSModelFullRenderMask=1

; Validated V311 behavior. Forces explicit ModelInfo RenderSlice values through the full 0x1F mask path.
ModelInfoFullRenderSlice=1

[Diagnostics]
; ASI 0.2 pass-through OdinMeshInstance tracing.
; This does NOT alter any Odin rendering decision.
OdinInstancing=1

; 0 = log only first observation / state changes for query-style methods.
; 1 = log every RemoveHighResSegments/query and IsFullyLoaded query.
OdinTraceAllQueries=0

; Safety cap for ODIN event lines.
OdinEventLimit=5000

; Reserved for the next instrumentation stage.
PoolTelemetry=0
